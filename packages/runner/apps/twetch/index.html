<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Twetch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Twetch</div>
      <nav class="tabs">
        <button class="tab active" data-tab="feed">Feed</button>
        <button class="tab" data-tab="notifications">Notifications <span id="notif-badge" class="badge hidden"></span></button>
        <button class="tab" data-tab="memes">Memes</button>
        <button class="tab" data-tab="market">Market</button>
      </nav>
      <div class="me">
        <img id="me-avatar" class="avatar hidden" alt="" />
        <div class="me-text">
          <div id="me-handle" class="me-handle">not signed in</div>
          <div id="me-hint" class="me-hint"></div>
        </div>
        <button id="refresh" class="ghost" title="Refresh">↻</button>
      </div>
    </header>

    <main>
      <section id="feed-view">
        <form id="compose" class="compose">
          <textarea id="compose-text" rows="3" maxlength="2000" placeholder="What's happening on-chain?"></textarea>
          <div class="compose-row">
            <span id="compose-status" class="status"></span>
            <button id="post-btn" type="submit">Post</button>
          </div>
        </form>
        <div id="feed" class="list"></div>
      </section>

      <section id="notifications-view" class="hidden">
        <div id="notifications" class="list"></div>
      </section>

      <section id="memes-view" class="hidden">
        <form id="meme-search" class="meme-search">
          <input id="meme-query" type="search" placeholder="Search the Meme Library (Pepe, Wojak, reaction…)" />
          <select id="meme-sort" title="Sort">
            <option value="recent">Recent</option>
            <option value="top">Top</option>
            <option value="popular">Popular</option>
            <option value="rarity">Rarity</option>
          </select>
          <button type="submit">Search</button>
        </form>
        <div id="meme-folders" class="chips"></div>
        <div id="meme-meta" class="status"></div>
        <div id="meme-grid" class="grid"></div>
        <div class="load-more">
          <button id="meme-more" class="hidden">Load more</button>
        </div>
      </section>

      <section id="market-view" class="hidden">
        <div class="chips" id="market-views">
          <button type="button" class="chip active" data-view="listings">Listings</button>
          <button type="button" class="chip" data-view="sales">Recent sales</button>
          <button type="button" class="chip" data-view="collections">Collections</button>
        </div>
        <div id="market-meta" class="status"></div>
        <div id="market-grid" class="grid"></div>
        <div class="load-more">
          <button id="market-more" class="hidden">Load more</button>
        </div>
      </section>
    </main>

    <div id="lightbox" class="lightbox hidden">
      <div class="lightbox-card">
        <button id="lightbox-close" class="ghost" aria-label="Close">×</button>
        <div id="lightbox-media" class="lightbox-media"></div>
        <h2 id="lightbox-title"></h2>
        <p id="lightbox-desc" class="post-meta"></p>
        <p id="lightbox-tags" class="post-meta"></p>
        <div class="lightbox-actions">
          <button id="lightbox-copy" type="button">Copy on-chain ref</button>
          <a id="lightbox-open" href="#" target="_blank" rel="noopener noreferrer">Open on Twetch</a>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
